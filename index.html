    .page-transition-stage {

    .page-transition-layer {

      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #183278;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: transform;
      transition: transform 300ms cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .page-transition-current {
      z-index: 2;
    }
    .page-transition-outgoing {
      z-index: 1;
      pointer-events: none;
    }
    .page-transition-current.entering.forward {
      transform: translate3d(100%, 0, 0);
    }
    .page-transition-current.active.forward {
      transform: translate3d(0, 0, 0);
    }
    .page-transition-outgoing.active.forward {
      transform: translate3d(-20%, 0, 0);
    }
    .page-transition-current.entering.back {
      transform: translate3d(-20%, 0, 0);
    }
    .page-transition-current.active.back {
      transform: translate3d(0, 0, 0);
    }
    .page-transition-outgoing.back {
      z-index: 3;
    }
    .page-transition-outgoing.active.back {
      transform: translate3d(100%, 0, 0);
    }
    .page-transition-layer.hint-layer {

    }
    .page-transition-current.hint-active {
      z-index: 3;
      transform: translate3d(0, 0, 0);
    }
    .page-transition-outgoing.hint-underlay,
    .page-transition-current.hint-return {
      z-index: 1;
      transform: translate3d(0, 0, 0);
    }
    .page-transition-outgoing.hint-exit {
      z-index: 3;
      transform: translate3d(0, 0, 0);
      transition: transform 280ms cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .page-transition-outgoing.hint-exit.active {
      transform: translate3d(0, 100%, 0);
    }
    .page-transition-layer.result-layer {
      transition: opacity 220ms ease-out, transform 220ms ease-out;
      will-change: opacity, transform;

    .page-transition-current.result-entering {

    }
    .page-transition-current.result-active {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }
    .page-transition-outgoing.result-exit {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);

    }
    .page-transition-outgoing.result-exit.active {
      opacity: 0;
      transform: translate3d(0, -4px, 0) scale(0.99);

    @media (prefers-reduced-motion: reduce) {

<body class="antialiased min-h-screen flex items-center justify-center p-0 sm:p-4 bg-gradient-to-br from-[#0e1d47] via-[#14285e] to-[#0d1a40] text-slate-100">

  <div id="root" class="w-full max-w-[430px] h-[100dvh] sm:h-[890px] bg-[#183278] sm:rounded-[44px] sm:shadow-[0_25px_60px_-15px_rgba(20,50,130,0.6)] overflow-hidden flex flex-col relative border-0 sm:border-[8px] sm:border-[#224896]"></div>

  <script type="text/babel">
    const { useState, useEffect, useLayoutEffect, useRef, useMemo, useCallback } = React;

    // ==========================================
    // SOUND SYNTHESIZER
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      click() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      correct() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.07);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.07 + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.07);
          osc.stop(this.ctx.currentTime + i * 0.07 + 0.18);
        });
      }
      wrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(140, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
    }
    const sound = new SoundEngine();

    function PageTransition({ screenKey, direction, children }) {
      const [transition, setTransition] = useState(null);
      const [phase, setPhase] = useState('idle');
      const lastPageRef = useRef({ screenKey, children });
      const framesRef = useRef([]);
      const timeoutRef = useRef(null);
      const getPageKind = key => key === 'hint'
        ? 'hint'
        : key === 'correct' || key === 'wrong'
          ? 'result'
          : 'page';

      useLayoutEffect(() => {
        const previousPage = lastPageRef.current;
        if (previousPage.screenKey !== screenKey) {
          framesRef.current.forEach(cancelAnimationFrame);
          framesRef.current = [];
          if (timeoutRef.current !== null) clearTimeout(timeoutRef.current);

          setTransition({
            outgoing: previousPage.children,
            outgoingKind: getPageKind(previousPage.screenKey),
            incomingKind: getPageKind(screenKey),
            direction,
          });
          setPhase('entering');
          const firstFrame = requestAnimationFrame(() => {
            const secondFrame = requestAnimationFrame(() => setPhase('active'));
            framesRef.current.push(secondFrame);
          });
          framesRef.current.push(firstFrame);
          timeoutRef.current = setTimeout(() => {
            timeoutRef.current = null;
            if (screenKey !== 'hint') {
              setTransition(null);
              setPhase('idle');
            }
          }, 320);
        }
        lastPageRef.current = { screenKey, children };
      }, [screenKey, direction, children]);

      useEffect(() => () => {
        framesRef.current.forEach(cancelAnimationFrame);
        if (timeoutRef.current !== null) clearTimeout(timeoutRef.current);
      }, []);

      const pageKind = getPageKind(screenKey);
      const currentTransitionClass = transition
        ? pageKind === 'hint'
          ? `hint-layer hint-${phase}`
          : pageKind === 'result'
            ? `result-layer result-${phase}`
            : transition.outgoingKind === 'hint'
              ? 'hint-return'
              : `${transition.direction} ${phase}`
        : pageKind === 'hint' ? 'hint-layer' : pageKind === 'result' ? 'result-layer' : '';
      const outgoingTransitionClass = transition
        ? transition.outgoingKind === 'hint' && transition.incomingKind !== 'hint'
          ? `hint-exit ${phase}`
          : transition.incomingKind === 'hint'
            ? 'hint-underlay'
            : transition.outgoingKind === 'result'
              ? `result-layer result-exit ${phase}`
              : `${transition.direction} ${phase}`
        : '';

      return (
        <div className="page-transition-stage">
          {transition && (
            <div
              aria-hidden="true"
              className={`page-transition-layer page-transition-outgoing ${outgoingTransitionClass}`}
            >
              {transition.outgoing}
            </div>
          )}
          <div key={screenKey} className={`page-transition-layer page-transition-current ${currentTransitionClass}`}>
            {children}
          </div>
        </div>
      );
    }

    // ==========================================
    // MASTER APP COMPONENT
    // ==========================================
    function App() {
      // Current active screen (1 to 18)
      // 'splash' | 'onboarding' | 'home' | 'categories' | 'levels' | 'game' | 'hint' | 'correct' | 'wrong'
      // 'daily' | 'stats' | 'achievements' | 'leaderboard' | 'history' | 'profile' | 'settings' | 'help' | 'offline'
      const [currentScreen, setCurrentScreen] = useState('home');
      const [transitionDirection, setTransitionDirection] = useState('forward');
      const navigationStackRef = useRef(['home']);
      const [showScreenPicker, setShowScreenPicker] = useState(false);

      // Player Global State
      const [playerLevel, setPlayerLevel] = useState(3);
      const [playerXp, setPlayerXp] = useState(112);
      const [xpNeeded, setXpNeeded] = useState(300);
      const [coins, setCoins] = useState(2450);
      const [streakDays, setStreakDays] = useState(5);
      const [lives, setLives] = useState(3);
      const [selectedCategory, setSelectedCategory] = useState('all');

      // Gameplay State
      const [selectedLevelNum, setSelectedLevelNum] = useState(3);
      const [profileMode, setProfileMode] = useState('Classic');
      const [profileDifficulty, setProfileDifficulty] = useState('Easy');
      const [gameTimer, setGameTimer] = useState(45);
      const [puzzleAnswers, setPuzzleAnswers] = useState({});
      const puzzleAnswersRef = useRef({});
      const [puzzleHistory, setPuzzleHistory] = useState([]);
      const [selectedPuzzleSlot, setSelectedPuzzleSlot] = useState(null);
      const [isGamePaused, setIsGamePaused] = useState(false);
      const [showGamePreferences, setShowGamePreferences] = useState(false);
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [hapticsEnabled, setHapticsEnabled] = useState(true);
      const [notificationsEnabled, setNotificationsEnabled] = useState(true);
      const [timerEnabled, setTimerEnabled] = useState(true);
      const [explanationEnabled, setExplanationEnabled] = useState(true);
      const [autoSubmitEnabled, setAutoSubmitEnabled] = useState(false);
      const [largeFontEnabled, setLargeFontEnabled] = useState(true);
      const [divisionSymbol, setDivisionSymbol] = useState('÷');

      // Daily Challenge State
      const [activeDailyDay, setActiveDailyDay] = useState(9);

      // Leaderboard Tab
      const [leaderboardTab, setLeaderboardTab] = useState('global');

      // History Tab
      const [historyTab, setHistoryTab] = useState('history');

      // Statistics Tab
      const [statsTab, setStatsTab] = useState('overview');

      // Timer effect in gameplay
      useEffect(() => {
        let interval = null;
        if (currentScreen === 'game' && !isGamePaused) {
          interval = setInterval(() => {
            setGameTimer(t => (t > 0 ? t - 1 : 0));
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [currentScreen, isGamePaused]);

      // Auto-slide ticker for 3D Champions Reel cards (sliding smoothly left to right)
      const championsReelRef = useRef(null);
      useEffect(() => {
        if (currentScreen !== 'home') return;
        let isPaused = false;
        const container = championsReelRef.current;
        if (!container) return;

        const interval = setInterval(() => {
          if (isPaused) return;
          if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 15) {
            container.scrollTo({ left: 0, behavior: 'smooth' });
          } else {
            container.scrollBy({ left: 138, behavior: 'smooth' });
          }
        }, 2800);

        const onPause = () => { isPaused = true; };
        const onResume = () => { setTimeout(() => { isPaused = false; }, 2500); };

        container.addEventListener('touchstart', onPause, { passive: true });
        container.addEventListener('touchend', onResume, { passive: true });
        container.addEventListener('mouseenter', onPause);
        container.addEventListener('mouseleave', onResume);

        return () => {
          clearInterval(interval);
          container.removeEventListener('touchstart', onPause);
          container.removeEventListener('touchend', onResume);
          container.removeEventListener('mouseenter', onPause);
          container.removeEventListener('mouseleave', onResume);
        };
      }, [currentScreen]);

      const formatTimer = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const navigateTo = (screen, replaceCurrent = false) => {
        if (screen === currentScreen) return;
        sound.click();
        const stack = navigationStackRef.current;
        const previousIndex = stack.lastIndexOf(screen);
        if (replaceCurrent) {
          navigationStackRef.current = [...stack.slice(0, -1), screen];
          setTransitionDirection('forward');
        } else if (previousIndex >= 0) {
          navigationStackRef.current = stack.slice(0, previousIndex + 1);
          setTransitionDirection('back');
        } else {
          navigationStackRef.current = [...stack, screen];
          setTransitionDirection('forward');
        }
        setCurrentScreen(screen);
        setShowScreenPicker(false);
      };

      const puzzleSlots = [
        { slot: 0, row: 0, column: 0, answer: 10 },
        { slot: 1, row: 2, column: 0, answer: 9 },
        { slot: 2, row: 2, column: 2, answer: 5 },
        { slot: 3, row: 4, column: 2, answer: 12 },
        { slot: 4, row: 2, column: 4, answer: 17 },
        { slot: 5, row: 2, column: 8, answer: 20 },
      ];
      const puzzleRows = [
        [{ slot: 0 }, '+', '7', '=', '17', null, null, null, null],
        ['+', null, '+', null, null, null, null, null, null],
        [{ slot: 1 }, null, { slot: 2 }, null, { slot: 4 }, '+', '3', '=', { slot: 5 }],
        ['=', null, '=', null, '-', null, null, null, null],
        ['19', '-', { slot: 3 }, '=', '7', null, null, null, null],
        [null, null, null, null, '=', null, null, null, null],
        [null, null, null, null, '10', null, null, null, null],
      ];
      const puzzleNumbers = [20, 12, 5, 10, 17, 9];

      const resetPuzzle = () => {
        puzzleAnswersRef.current = {};
        setPuzzleAnswers({});
        setPuzzleHistory([]);
        setSelectedPuzzleSlot(null);
        setGameTimer(45);
      };

      const startNewPuzzle = () => {
        resetPuzzle();
        navigateTo('game');
      };

      const submitPuzzle = (answers) => {

              <div className="flex items-center justify-between">
                <button onClick={() => navigateTo('home')} aria-label="Back to home" className="grid h-10 w-10 place-items-center rounded-full bg-[#1d3b7d] text-3xl leading-none">‹</button>
                <h1 className="text-xl font-black">Leaderboard</h1>
                <button onClick={() => navigateTo('help')} aria-label="Leaderboard information" className="grid h-10 w-10 place-items-center rounded-full bg-[#1d3b7d] text-xl font-black">ⓘ</button>
              </div>
              <div className="mt-4 grid grid-cols-2 rounded-full bg-[#203974] p-1">
                {['Brains', 'Endless'].map((tab, i) => (
                  <button key={tab} onClick={() => setLeaderboardTab(i ? 'endless' : 'brains')} className={`rounded-full py-2 text-sm font-extrabold ${leaderboardTab === (i ? 'endless' : 'brains') || (leaderboardTab === 'global' && i === 0) ? 'bg-white text-[#294987]' : 'text-white'}`}>{tab}</button>
                ))}
              </div>
            </header>
            <div className="flex-1 overflow-y-auto no-scrollbar px-3 py-3">
              <div className="mb-3 grid grid-cols-3 rounded-2xl bg-[#506da8] p-2 text-center">
                {['Weekly', 'World', 'Region'].map((tab, i) => (
                  <button key={tab} onClick={() => setLeaderboardTab(tab.toLowerCase())} className={`rounded-full py-2 text-xs font-bold ${leaderboardTab === tab.toLowerCase() || (leaderboardTab === 'global' && i === 0) ? 'bg-white text-[#294987]' : 'bg-[#263c72] text-white'}`}>{tab}{i === 0 && <span className="block text-[9px]">◷ 3d 06h</span>}</button>
                ))}
              </div>
              <div className="grid grid-cols-3 gap-2 rounded-2xl border border-white/25 bg-[#45639f] p-2 pb-4">
                {podium.map(player => (
                  <div key={player.rank} className={`relative flex min-h-48 flex-col items-center rounded-2xl bg-gradient-to-b ${player.color} px-1 pt-2 text-center text-[#17203a] shadow-md ${player.rank === 1 ? '-translate-y-1' : 'mt-4'}`}>
                    <span className="absolute -top-5 text-2xl">{player.flag}</span>
                    <span className="mt-5 text-xs font-black">{player.name}</span>
                    <span className="my-auto text-5xl">🎁</span>
                    <span className="w-full rounded-full bg-[#183d82]/75 py-1 text-xs font-black text-white">🎓 {player.score}</span>
                    <span className="absolute -bottom-4 grid h-9 w-9 place-items-center rounded-full border-2 border-white bg-[#b67932] font-black text-white">{player.rank}</span>
                  </div>
                ))}
              </div>
              <div className="mt-4 space-y-2 pb-3">
                {topPlayers.map(player => (
                  <div key={player.rank} className="flex items-center justify-between rounded-2xl bg-gradient-to-r from-[#fff9e8] to-[#fff0d3] px-3 py-3 text-[#191919] shadow-sm">
                    <div className="flex min-w-0 items-center gap-2">
                      <span className="w-6 text-lg font-black">{player.rank}</span><span className="text-xl">{player.flag}</span><span className="truncate text-sm font-bold">{player.name}</span>
                    </div>
                    <span className="ml-2 shrink-0 rounded-full bg-[#efdbb5] px-2 py-1 text-xs font-black">🎓 {player.score}</span>
                  </div>
                ))}
                <div className="sticky bottom-0 flex items-center justify-between rounded-2xl border border-emerald-200 bg-gradient-to-r from-[#84f49b] to-[#69e780] px-3 py-3 text-black shadow-lg">
                  <span className="text-xs font-bold">10 &nbsp; 🇺🇸 &nbsp; Player ✎</span><span className="text-sm font-black">🎓 0</span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ========================================================
      // 14. PUZZLE HISTORY / SAVED (Pixel Perfect to Screen 14)
      // ==========================================
      const renderHistoryScreen = () => {
        const historyItems = [
          { eq: '(12 + 8) × 2 - 6 = 34', time: 'Today • Level 3', solved: true },
          { eq: '(15 - 7) × 3 = 24', time: 'Today • Level 2', solved: true },
          { eq: '8 + 6 ÷ 2 = 11', time: 'Yesterday • Level 1', solved: true },
          { eq: '(9 × 4) ÷ 2 = 38', time: 'Yesterday • Level 3', solved: true },
          { eq: '(14 - 7) × 2 = 14', time: 'Dec 12 • Level 2', solved: false },
          { eq: '12 + 3 ÷ 5 = 9', time: 'Dec 11 • Level 1', solved: false },
        ];

        return (
          <div className="flex-1 flex flex-col bg-slate-50 select-none overflow-hidden">
            <div className="flex-1 overflow-y-auto no-scrollbar px-4 py-3">
              <StatusBar />

              {/* Header */}
              <div className="flex items-center gap-3 pt-1 pb-3">
                <button onClick={() => navigateTo('home')} className="p-1 text-slate-600 hover:text-slate-900">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <h1 className="text-base font-black font-display text-slate-900">Puzzle History</h1>
              </div>

              {/* Filter Tabs */}
              <div className="flex items-center gap-2 mb-4">
                {['History', 'Saved'].map((tab) => (
                  <button
                    key={tab}
                    onClick={() => setHistoryTab(tab.toLowerCase())}
                    className={`px-5 py-1.5 rounded-full text-xs font-bold transition-all ${
                      historyTab === tab.toLowerCase()
                        ? 'bg-blue-600 text-white shadow-sm'
                        : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    {tab}
                  </button>
                ))}
              </div>

              {/* History Items */}
              <div className="space-y-2.5 pb-4">
                {historyItems.map((item, i) => (
                  <div key={i} className="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-mono text-xs">
                        🔢
                      </div>
                      <div>
                        <span className="text-xs font-bold font-mono text-slate-800 block">{item.eq}</span>
                        <span className="text-[10px] text-slate-400">{item.time}</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {item.solved && <span className="text-emerald-500 font-bold text-xs">✓</span>}
                      <span className="text-slate-300 text-sm">🔖</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      // ========================================================
      // 15. PROFILE SCREEN (Pixel Perfect to Screen 15)
      // ==========================================
      const renderProfileScreen = () => (
        <div className="flex-1 flex flex-col bg-slate-50 select-none overflow-hidden">
          <div className="flex-1 overflow-y-auto no-scrollbar px-4 py-3">
            <StatusBar />

            {/* Header */}
            <div className="relative flex items-center justify-between pt-1 pb-3">
              <div className="absolute left-0 top-1">
                <button onClick={() => navigateTo('home')} aria-label="Back to home" className="grid h-10 w-10 place-items-center rounded-full bg-white text-xl font-bold text-slate-700 shadow-sm hover:text-blue-600 transition-colors">
                  ←
                </button>
              </div>
              <h1 className="absolute left-1/2 -translate-x-1/2 text-lg font-black font-display text-slate-900">Profile</h1>
              <div className="absolute right-0 top-1">
                <button onClick={() => navigateTo('settings')} aria-label="Settings" className="grid h-10 w-10 place-items-center rounded-full bg-white text-xl text-slate-600 shadow-sm hover:text-slate-900">
                  ⚙
                </button>
              </div>
            </div>

            {/* Avatar & User Details */}
            <div className="rounded-t-[32px] bg-gradient-to-br from-[#e5efff] to-[#f3efff] px-4 pt-4 pb-5">
              <div className="flex items-center justify-between">
                <div className="flex min-w-0 items-center gap-2">
                  <span className="grid h-14 w-14 shrink-0 place-items-center rounded-xl border-2 border-white bg-white text-4xl shadow">🇺🇸</span>
                  <div className="min-w-0">
                    <div className="flex items-center gap-1">
                      <h2 className="truncate text-lg font-black">Guest-JFNZLZ</h2>
                      <button aria-label="Edit player name" className="rounded bg-blue-500 px-1 text-xs text-white">✎</button>
                    </div>
                    <span className="text-sm text-slate-500">◉ Lv.{playerLevel}</span>
                  </div>
                </div>
                <div className="grid h-20 w-16 place-items-center rounded-b-2xl border-[3px] border-amber-400 bg-blue-500 text-3xl shadow-md">🎓<span className="-mt-5 text-sm font-black text-white">0</span></div>
              </div>
            </div>

            <div className="my-3 grid grid-cols-3 rounded-full bg-slate-200 p-1">
              {['Classic', 'Daily', 'Endless'].map(mode => (
                <button key={mode} onClick={() => setProfileMode(mode)} className={`rounded-full py-2 text-sm font-bold ${profileMode === mode ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500'}`}>{mode}</button>
              ))}
            </div>
            {profileMode === 'Classic' && (
              <div className="mb-4 grid grid-cols-4 text-center text-xs text-slate-600">
                {['Easy', 'Medium', 'Hard', 'Expert'].map(level => (
                  <button key={level} onClick={() => setProfileDifficulty(level)} className={`relative py-2 font-semibold ${profileDifficulty === level ? 'text-slate-900' : ''}`}>
                    {level}{profileDifficulty === level && <span className="absolute bottom-0 left-1/4 h-0.5 w-1/2 rounded-full bg-blue-600" />}
                  </button>
                ))}
              </div>
            )}

            {/* Links Menu */}
            {[
              { title: 'Games', icon: '🎮', tint: 'bg-violet-100 text-violet-600', rows: [['Games Started', '1'], ['Games Won', '0'], ['Win Rate', '0%']] },
              { title: 'Time', icon: '⌛', tint: 'bg-emerald-100 text-emerald-600', rows: [['Best Time', '--:--'], ['Average Time', '--:--']] },
            ].map(section => (
              <section key={section.title} className="mb-4">
                <h2 className="mb-2 flex items-center gap-3 text-base font-black"><span className={`grid h-8 w-8 place-items-center rounded-full ${section.tint}`}>{section.icon}</span>{section.title}</h2>
                <div className="rounded-2xl bg-white px-4 shadow-sm">
                  {section.rows.map(([label, value], index) => (
                    <div key={label} className={`flex items-center justify-between py-4 text-sm ${index ? 'border-t border-slate-100' : ''}`}><span>{label}</span><span className="font-semibold">{value}</span></div>
                  ))}
                </div>
              </section>
            ))}
            <button className="mx-auto my-4 block rounded-full border border-blue-500 px-8 py-2.5 text-sm font-semibold text-blue-600">Reset Stats</button>
          </div>
        </div>
      );

      // ========================================================
      // 16. SETTINGS SCREEN (Pixel Perfect to Screen 16)
      // ==========================================
      const renderSettingsScreen = () => (
        <div className="flex-1 flex flex-col overflow-hidden bg-[#f4f4f4] select-none">
          <header className="shrink-0 bg-white px-5 pt-5 pb-3">
            <div className="flex items-center justify-between">
              <button onClick={() => navigateTo('profile')} aria-label="Back to profile" className="grid h-11 w-11 place-items-center rounded-full bg-[#f1f1f2] text-3xl leading-none text-[#31569a]">‹</button>
              <h1 className="text-xl font-black">Settings</h1><span className="h-11 w-11" />
            </div>
          </header>
          <div className="flex-1 overflow-y-auto no-scrollbar bg-[#f4f4f4] pt-2">
            <button onClick={() => navigateTo('achievements')} className="flex w-full items-center justify-between border-b border-slate-100 bg-white px-6 py-5 text-left text-base"><span>Store</span><span className="text-xl">›</span></button>
            <div className="mt-2 bg-white">
              {[
                ['Sound', soundEnabled, setSoundEnabled],
                ['Timer', timerEnabled, setTimerEnabled],
              ].map(([label, checked, setter]) => (
                <label key={label} className="flex items-center justify-between border-b border-slate-100 px-6 py-5 text-base">
                  <span>{label}</span><input type="checkbox" checked={checked} onChange={event => { setter(event.target.checked); if (label === 'Sound') sound.muted = !event.target.checked; }} className="h-6 w-11 accent-blue-600" />
                </label>
              ))}
            </div>
            <div className="mt-2 bg-white">
              {[
                ['How to Play', 'help'],
                ['Division Symbol Style', 'game'],
              ].map(([label, screen]) => <button key={label} onClick={() => navigateTo(screen)} className="flex w-full items-center justify-between border-b border-slate-100 px-6 py-5 text-left text-base"><span>{label}</span><span className="text-xl">›</span></button>)}
            </div>
            <div className="mt-2 bg-white">
              {[
                ['Show "Explanation" Button', explanationEnabled, setExplanationEnabled],
                ['Auto Submit', autoSubmitEnabled, setAutoSubmitEnabled],
                ['Large Font', largeFontEnabled, setLargeFontEnabled],
              ].map(([label, checked, setter]) => (
                <label key={label} className="flex items-center justify-between border-b border-slate-100 px-6 py-5 text-base">
                  <span>{label}</span><input type="checkbox" checked={checked} onChange={event => setter(event.target.checked)} className="h-6 w-11 accent-blue-600" />
                </label>
              ))}
            </div>
            <div className="mt-2 bg-white">
              {['Feedback', 'Become a Volunteer Translator', 'Redeem Code'].map(label => <button key={label} onClick={() => navigateTo('help')} className="flex w-full items-center justify-between border-b border-slate-100 px-6 py-5 text-left text-base"><span>{label}</span><span className="text-xl">›</span></button>)}
            </div>
            <div className="py-8 text-center text-xs leading-6 text-slate-400">Version 1.0.0<br /><span className="text-blue-500">Privacy Policy&nbsp;&nbsp; | &nbsp;&nbsp;Terms of Service</span></div>
          </div>
        </div>
      );

      // ========================================================
      // 17. HELP & SUPPORT (Pixel Perfect to Screen 17)
      // ==========================================
      const renderHelpScreen = () => {
        const supportItems = [
          { label: 'FAQs', desc: 'Find answers to common questions', icon: '❓' },
          { label: 'Contact Us', desc: 'Get in touch with our team', icon: '✉️' },
          { label: 'Report a Problem', desc: 'Help us improve the app', icon: '⚠️' },
          { label: 'Feedback', desc: 'Share your thoughts', icon: '💬' },
        ];

        return (
          <div className="flex-1 flex flex-col bg-slate-50 select-none overflow-hidden">
            <div className="flex-1 overflow-y-auto no-scrollbar px-4 py-3">
              <StatusBar />

              {/* Header */}
              <div className="flex items-center gap-3 pt-1 pb-3">
                <button onClick={() => navigateTo('settings')} className="p-1 text-slate-600 hover:text-slate-900">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <h1 className="text-base font-black font-display text-slate-900">Help & Support</h1>
              </div>

              {/* Cards List */}
              <div className="space-y-2.5 my-2 pb-4">
                {supportItems.map((item, i) => (
                  <div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer hover:border-slate-300 active:scale-[0.99] transition-all">
                    <div className="flex items-center gap-3.5">
                      <div className="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                        {item.icon}
                      </div>
                      <div>
                        <h3 className="text-xs font-bold text-slate-900">{item.label}</h3>
                        <p className="text-[10px] text-slate-400">{item.desc}</p>
                      </div>
                    </div>
                    <span className="text-slate-400 text-sm">›</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      // ========================================================
      // 18. OFFLINE MODE (Pixel Perfect to Screen 18)
      // ==========================================
      const renderOfflineScreen = () => (
        <div className="flex-1 flex flex-col bg-white select-none relative overflow-hidden">
          <StatusBar />

          <div className="my-auto px-6 flex flex-col items-center text-center">
            {/* Crossed Signals Graphic */}
            <div className="w-20 h-20 rounded-3xl bg-blue-50 border border-blue-100 flex items-center justify-center text-3xl shadow-sm mb-6">
              📡
            </div>

            <h2 className="text-2xl font-black font-display text-slate-900">Offline Mode</h2>
            <p className="text-xs text-slate-500 mt-2 max-w-xs leading-relaxed">
              You're offline.<br />No internet connection detected.<br />You can still play saved puzzles and access some features.
            </p>

            <button
              onClick={() => navigateTo('home')}
              className="w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-base shadow-lg shadow-blue-500/25 mt-6 active:scale-95 transition-all"
            >
              Continue Offline
            </button>

            <button
              onClick={() => navigateTo('home')}
              className="text-xs font-bold text-blue-600 hover:underline mt-4"
            >
              Check Connection
            </button>
          </div>

          {/* Subtle Mountain Landscape Graphic at bottom */}
          <div className="w-full relative h-20">
            <svg className="absolute bottom-0 w-full" viewBox="0 0 400 80" fill="none">
              <path d="M0 50L60 30L140 60L220 20L310 60L400 35V80H0Z" fill="#f1f5f9" />
              <path d="M0 65L80 45L180 70L280 40L400 60V80H0Z" fill="#e2e8f0" opacity="0.6" />
            </svg>
          </div>
        </div>
      );

      // ==========================================
      // MAIN SCREEN ROUTER
      // ==========================================
      const renderActiveScreen = () => {
        switch (currentScreen) {
          case 'splash': return renderSplashScreen();
          case 'onboarding': return renderOnboardingScreen();
          case 'home': return renderHomeScreen();
          case 'categories': return renderCategoriesScreen();
          case 'levels': return renderLevelSelectScreen();
          case 'game': return renderGameScreen();
          case 'hint': return renderHintScreen();
          case 'correct': return renderCorrectScreen();
          case 'wrong': return renderWrongScreen();
          case 'daily': return renderDailyScreen();
          case 'battle': return renderBattleScreen();
          case 'stats': return renderStatsScreen();
          case 'achievements': return renderAchievementsScreen();
          case 'leaderboard': return renderLeaderboardScreen();
          case 'history': return renderHistoryScreen();
          case 'profile': return renderProfileScreen();
          case 'settings': return renderSettingsScreen();
          case 'help': return renderHelpScreen();
          case 'offline': return renderOfflineScreen();
          default: return renderHomeScreen();
        }
      };

      return (
        <div className="flex-1 flex flex-col h-full relative font-sans">
          <PageTransition screenKey={currentScreen} direction={transitionDirection}>
            {renderActiveScreen()}
          </PageTransition>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
