<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Math Puzzle - Think • Solve • Grow</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/fonts/cormorant-garamond.css">
  <script>
    // Apply native/mobile full-viewport lock before first paint so the screen never jumps on any Android device
    (function () {
      var ua = navigator.userAgent || '';
      var isAndroidOrMobile = /Android|Mobile|wv/i.test(ua) || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      if (isAndroidOrMobile) {
        document.documentElement.classList.add('nm-native-apk');
      }
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #0e1d47;
    }
    /* Full-bleed lock on all Android / mobile devices (prevents 640px+ tablets/foldables from jumping into desktop phone frame) */
    html.nm-native-apk body {
      padding: 0 !important;
      display: block !important;
      height: 100dvh !important;
      width: 100vw !important;
      overflow: hidden !important;
    }
    html.nm-native-apk #root {
      max-width: 100% !important;
      width: 100vw !important;
      height: 100dvh !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      margin: 0 !important;
    }
    body, html, * {
      font-family: 'Cormorant Garamond', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif;
    }
    body {
      font-family: 'Cormorant Garamond', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif;
      font-feature-settings: "lnum" 1, "tnum" 1;
    }
    .reference-screen {
      --app-blue: #2d63d8;
      --app-blue-dark: #203d87;
      --app-ink: #151923;
      --app-muted: #9299a8;
      --app-canvas: #f2f5ff;
      color: var(--app-ink);
      background: var(--app-canvas);
    }
    .reference-home {
      background:
        radial-gradient(ellipse at 12% 10%, rgba(255,255,255,.86), transparent 35%),
        linear-gradient(145deg, #e6edff 0%, #f4f6ff 53%, #e6efff 100%);
    }
    .reference-home::before {
      position: absolute;
      inset: 8% -18% 7%;
      z-index: 0;
      content: "×  2  +  7  =  9     ÷  4  −  1     8  ×  3";
      color: rgba(67, 98, 171, .045);
      font-size: clamp(38px, 12vw, 62px);
      font-weight: 900;
      line-height: 3.7;
      letter-spacing: .16em;
      transform: rotate(-18deg);
      pointer-events: none;
      overflow: hidden;
    }
    .reference-home > * {
      position: relative;
      z-index: 1;
    }
    .reference-bottom-nav {
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      box-shadow: 0 -1px 0 rgba(24, 39, 75, .08);
    }
    .reference-bottom-nav button {
      min-height: 64px;
      color: #a5a9b4;
      transition: color 180ms ease, transform 180ms ease;
    }
    .reference-bottom-nav button:active {
      transform: scale(.94);
    }
    .reference-bottom-nav button[aria-current="page"] {
      color: var(--app-blue);
    }
    .reference-bottom-nav button[aria-current="page"] svg {
      fill: currentColor;
    }
    .reference-primary-button {
      background: var(--app-blue);
      box-shadow: 0 5px 12px rgba(45, 99, 216, .2);
      transition: transform 160ms ease, filter 160ms ease;
    }
    .reference-primary-button:active {
      transform: scale(.98);
      filter: brightness(.96);
    }
    .reference-card {
      border: 1px solid rgba(255,255,255,.9);
      background: rgba(255,255,255,.96);
      box-shadow: 0 5px 14px rgba(42, 61, 110, .12);
    }
    #root .flat-puzzle-card {
      background: transparent !important;
      border-color: transparent !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    #root .flat-puzzle-option {
      background: transparent !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    #root .flat-puzzle-option.is-selected {
      background: #2563eb !important;
      border-radius: 12px !important;
      color: #fff !important;
      box-shadow: 0 0 0 4px #bfdbfe !important;
    }
    @keyframes reference-screen-enter {
      from { opacity: 0; transform: translate3d(0, 10px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    .reference-screen-enter {
      animation: reference-screen-enter 260ms cubic-bezier(.2,.75,.25,1) both;
    }
    /* Sci-Fi 3D Arcade Effects & Animations (Lightweight Pure-CSS for High Performance) */
    .scifi-card-3d {
      position: relative;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1), filter 0.2s ease;
      transform: translateZ(0);
      will-change: transform;
      cursor: pointer;
    }
    .scifi-card-3d:hover {
      transform: perspective(800px) translateY(-3px) scale(1.02);
      filter: brightness(1.08) drop-shadow(0 6px 16px rgba(0, 229, 255, 0.45));
    }
    .scifi-card-3d:active {
      transform: perspective(800px) translateY(1.5px) scale(0.98);
      filter: brightness(0.95);
    }
    .scifi-glow-cyan {
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.3);
    }
    /* 3D Reel Cards: Mathematical Architecture Design (Clean Precision, No Outer Glow Animation) */
    .math-arch-card {
      position: relative;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1), border-color 0.2s ease;
      overflow: hidden;
    }
    .math-arch-card:hover {
      transform: translateY(-2px);
    }
    .math-arch-card:active {
      transform: scale(0.98);
    }
    /* Architectural Mathematical Blueprint Grid */
    .math-blueprint-grid {
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
      background-size: 14px 14px;
    }
    .scifi-game-bg {
      background-color: #1a2f6c;
      background-image:
        radial-gradient(ellipse 480px 280px at 50% 0%, rgba(0, 230, 255, 0.45), transparent 75%),
        radial-gradient(circle 380px at 92% 35%, rgba(168, 85, 247, 0.38), transparent 70%),
        radial-gradient(circle 360px at 8% 60%, rgba(59, 130, 246, 0.42), transparent 70%),
        radial-gradient(ellipse 550px 260px at 50% 100%, rgba(0, 240, 255, 0.48), transparent 75%),
        linear-gradient(135deg, rgba(129, 140, 248, 0.22) 0%, transparent 45%, rgba(14, 165, 233, 0.2) 75%, transparent 100%),
        linear-gradient(rgba(56, 189, 248, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.09) 1px, transparent 1px),
        linear-gradient(180deg, #1b357d 0%, #1e2e74 35%, #22296e 70%, #173272 100%);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 28px 28px, 28px 28px, 100% 100%;
    }
    .scifi-header-bg {
      background-color: #1686b5;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.09) 1px, transparent 1px),
        linear-gradient(180deg, #1686b5 0%, #1573a8 65%, #1b357d 100%);
      background-size: 28px 28px, 28px 28px, 100% 100%;
    }
    @media (max-width: 345px) {
      .home-hdr-xp-text,
      .home-hdr-pro-badge {
        display: none !important;
      }
    }
    .page-transition-stage {
      position: relative;
      flex: 1 1 0%;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      contain: paint layout;
    }
    .page-transition-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #183278;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      will-change: transform;
    }
    .page-transition-current {
      z-index: 2;
    }
    .page-transition-outgoing {
      z-index: 1;
      pointer-events: none;
    }

    /* Keyframe Animations for Smooth Page Transitions on Android & Mobile */
    @keyframes pageSlideInFromRight {
      0% {
        transform: translate3d(100%, 0, 0);
        -webkit-transform: translate3d(100%, 0, 0);
      }
      100% {
        transform: translate3d(0, 0, 0);
        -webkit-transform: translate3d(0, 0, 0);
      }
    }
    @-webkit-keyframes pageSlideInFromRight {
      0% { -webkit-transform: translate3d(100%, 0, 0); }
      100% { -webkit-transform: translate3d(0, 0, 0); }
    }

    @keyframes pageSlideOutToLeft {
      0% {
        transform: translate3d(0, 0, 0);
        -webkit-transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-25%, 0, 0);
        -webkit-transform: translate3d(-25%, 0, 0);
      }
    }
    @-webkit-keyframes pageSlideOutToLeft {
      0% { -webkit-transform: translate3d(0, 0, 0); }
      100% { -webkit-transform: translate3d(-25%, 0, 0); }
    }

    @keyframes pageSlideInFromLeft {
      0% {
        transform: translate3d(-25%, 0, 0);
        -webkit-transform: translate3d(-25%, 0, 0);
      }
      100% {
        transform: translate3d(0, 0, 0);
        -webkit-transform: translate3d(0, 0, 0);
      }
    }
    @-webkit-keyframes pageSlideInFromLeft {
      0% { -webkit-transform: translate3d(-25%, 0, 0); }
      100% { -webkit-transform: translate3d(0, 0, 0); }
    }

    @keyframes pageSlideOutToRight {
      0% {
        transform: translate3d(0, 0, 0);
        -webkit-transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(100%, 0, 0);
        -webkit-transform: translate3d(100%, 0, 0);
      }
    }
    @-webkit-keyframes pageSlideOutToRight {
      0% { -webkit-transform: translate3d(0, 0, 0); }
      100% { -webkit-transform: translate3d(100%, 0, 0); }
    }

    /* Direction: Forward (Next screen slides in from right to left, old slides out to left) */
    .page-anim-in-forward {
      z-index: 2;
      animation: pageSlideInFromRight 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
      -webkit-animation: pageSlideInFromRight 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
    }
    .page-anim-out-forward {
      z-index: 1;
      animation: pageSlideOutToLeft 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
      -webkit-animation: pageSlideOutToLeft 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
    }

    /* Direction: Back (Previous screen slides in from left to right, old slides out to right) */
    .page-anim-in-back {
      z-index: 1;
      animation: pageSlideInFromLeft 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
      -webkit-animation: pageSlideInFromLeft 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
    }
    .page-anim-out-back {
      z-index: 3;
      animation: pageSlideOutToRight 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
      -webkit-animation: pageSlideOutToRight 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
    }

    /* Hint Screen: Slide Up / Down */
    @keyframes hintSlideInUp {
      0% { transform: translate3d(0, 100%, 0); -webkit-transform: translate3d(0, 100%, 0); }
      100% { transform: translate3d(0, 0, 0); -webkit-transform: translate3d(0, 0, 0); }
    }
    @-webkit-keyframes hintSlideInUp {
      0% { -webkit-transform: translate3d(0, 100%, 0); }
      100% { -webkit-transform: translate3d(0, 0, 0); }
    }
    @keyframes hintSlideOutDown {
      0% { transform: translate3d(0, 0, 0); -webkit-transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(0, 100%, 0); -webkit-transform: translate3d(0, 100%, 0); }
    }
    @-webkit-keyframes hintSlideOutDown {
      0% { -webkit-transform: translate3d(0, 0, 0); }
      100% { -webkit-transform: translate3d(0, 100%, 0); }
    }

    .page-anim-in-hint {
      z-index: 3;
      background: transparent !important;
      animation: hintSlideInUp 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
      -webkit-animation: hintSlideInUp 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
    }
    .page-anim-out-hint {
      z-index: 3;
      animation: hintSlideOutDown 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
      -webkit-animation: hintSlideOutDown 280ms cubic-bezier(0.25, 0.8, 0.25, 1) both;
    }
    .page-transition-layer.hint-layer {
      background: transparent;
    }

    /* Result Screens (Correct / Wrong) */
    @keyframes resultFadeIn {
      0% { opacity: 0; transform: translate3d(0, 8px, 0) scale(0.98); -webkit-transform: translate3d(0, 8px, 0) scale(0.98); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); -webkit-transform: translate3d(0, 0, 0) scale(1); }
    }
    @-webkit-keyframes resultFadeIn {
      0% { opacity: 0; -webkit-transform: translate3d(0, 8px, 0) scale(0.98); }
      100% { opacity: 1; -webkit-transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes resultFadeOut {
      0% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); -webkit-transform: translate3d(0, 0, 0) scale(1); }
      100% { opacity: 0; transform: translate3d(0, -4px, 0) scale(0.99); -webkit-transform: translate3d(0, -4px, 0) scale(0.99); }
    }
    @-webkit-keyframes resultFadeOut {
      0% { opacity: 1; -webkit-transform: translate3d(0, 0, 0) scale(1); }
      100% { opacity: 0; -webkit-transform: translate3d(0, -4px, 0) scale(0.99); }
    }

    .page-anim-in-result {
      z-index: 2;
      animation: resultFadeIn 220ms ease-out both;
      -webkit-animation: resultFadeIn 220ms ease-out both;
    }
    .page-anim-out-result {
      z-index: 1;
      animation: resultFadeOut 180ms ease-out both;
      -webkit-animation: resultFadeOut 180ms ease-out both;
    }
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0f172a;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar,
    .overflow-y-auto {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      transform: translateZ(0);
      will-change: scroll-position;
    }

    /* Mobile GPU optimization: cap heavy blurs to 8px on screens <= 768px for solid 60fps */
    @media (max-width: 768px) {
      .backdrop-blur-xl,
      .backdrop-blur-2xl,
      .backdrop-blur-3xl {
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
      }
    }

    /* Zero-filter GPU ambient glow accents (replaces fill-rate-heavy blur-3xl for mobile) */
    .scifi-ambient-cyan {
      background: radial-gradient(circle, rgba(6, 182, 212, 0.28) 0%, rgba(6, 182, 212, 0.08) 45%, transparent 70%);
      pointer-events: none;
    }
    .scifi-ambient-blue {
      background: radial-gradient(circle, rgba(59, 130, 246, 0.28) 0%, rgba(59, 130, 246, 0.08) 45%, transparent 70%);
      pointer-events: none;
    }
    .scifi-ambient-purple {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.24) 0%, rgba(168, 85, 247, 0.07) 45%, transparent 70%);
      pointer-events: none;
    }
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .pulse-subtle {
      animation: pulse-subtle 2s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: float 3s infinite ease-in-out;
    }
    /* Modern Arcade Tile & HUD Animations */
    @keyframes tilePop {
      0% { transform: scale(0.6); opacity: 0.3; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-tile-pop {
      animation: tilePop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes tileShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .animate-tile-shake {
      animation: tileShake 0.35s ease-in-out;
    }

    @keyframes pulseSlotGlow {
      0%, 100% {
        box-shadow: 0 0 8px rgba(0, 229, 255, 0.4), inset 0 0 6px rgba(0, 229, 255, 0.3);
        border-color: rgba(0, 229, 255, 0.85);
      }
      50% {
        box-shadow: 0 0 22px rgba(0, 229, 255, 0.95), inset 0 0 14px rgba(0, 229, 255, 0.6);
        border-color: #67e8f9;
      }
    }
    .animate-slot-pulse {
      animation: pulseSlotGlow 1.4s infinite ease-in-out;
    }

    @keyframes timerWarningPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.6);
      }
      50% {
        box-shadow: 0 0 14px 4px rgba(239, 68, 68, 0.9);
        color: #ef4444;
        border-color: #ef4444;
      }
    }
    .animate-timer-warning {
      animation: timerWarningPulse 1s infinite ease-in-out;
    }

    @keyframes victoryGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 45px rgba(16, 185, 129, 0.95);
      }
    }
    .animate-victory-glow {
      animation: victoryGlow 2s infinite ease-in-out;
    }

    @keyframes levelSelectedPulse {
      0%, 100% {
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
        border-color: rgba(0, 229, 255, 0.8);
      }
      50% {
        box-shadow: 0 0 24px rgba(0, 229, 255, 0.85);
        border-color: #a5f3fc;
      }
    }
    .animate-level-selected {
      animation: levelSelectedPulse 1.6s infinite ease-in-out;
    }

    /* Modern 3D Arcade Sci-Fi Puzzle Tiles */
    .scifi-tile-fixed {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 55%, #173887 100%);
      border: 1.5px solid #60a5fa;
      border-radius: 10px;
      box-shadow: 0 4px 0 #0b1d4d, 0 6px 12px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scifi-tile-tray-btn {
      background: linear-gradient(180deg, #1fc786 0%, #10b981 50%, #047857 100%);
      border: 1.5px solid #6ee7b7;
      border-radius: 10px;
      box-shadow: 0 4px 0 #064e3b, 0 6px 12px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .scifi-tile-tray-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .scifi-tile-tray-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #064e3b, 0 3px 6px rgba(0, 0, 0, 0.4);
    }
    .scifi-tile-tray-btn:disabled, .scifi-tile-tray-btn.is-used {
      opacity: 0.22;
      transform: scale(0.95);
      border-color: rgba(51, 65, 85, 0.8);
      background: rgba(30, 41, 59, 0.45);
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      filter: none;
    }

    .scifi-tile-operator {
      background: radial-gradient(circle at 50% 30%, #173d82 0%, #112d66 70%, #0d2252 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.6);
      border-radius: 9px;
      box-shadow: inset 0 2px 4px rgba(6, 25, 68, 0.45), 0 3px 6px rgba(4, 18, 52, 0.35);
      color: #38bdf8;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8), 0 0 14px rgba(0, 229, 255, 0.45);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @media (max-width: 380px) {
      .scifi-tile-fixed, .scifi-tile-slot-filled, .scifi-tile-slot-empty, .scifi-tile-slot-selected {
        border-radius: 8px;
        box-shadow: 0 2.5px 0 #0b1d4d, 0 3px 6px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      }
      .scifi-tile-tray-btn {
        border-radius: 8px;
        box-shadow: 0 2.5px 0 #064e3b, 0 3px 6px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      }
      .scifi-tile-operator {
        border-radius: 7px;
      }
    }

    .scifi-tile-slot-empty {
      background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.18) 0%, rgba(18, 45, 105, 0.75) 100%);
      border: 2px dashed rgba(56, 189, 248, 0.75);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3), inset 0 2px 8px rgba(10, 28, 72, 0.45);
      position: relative;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .scifi-tile-slot-empty:hover {
      border-color: #67e8f9;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.5), inset 0 2px 6px rgba(0, 0, 0, 0.5);
      transform: scale(1.02);
    }

    @keyframes slotSelectedPulse {
      0%, 100% {
        box-shadow: 0 0 16px rgba(245, 158, 11, 0.9), 0 0 30px rgba(245, 158, 11, 0.4), inset 0 0 10px rgba(251, 191, 36, 0.35);
        border-color: #fde047;
      }
      50% {
        box-shadow: 0 0 24px rgba(245, 158, 11, 1), 0 0 45px rgba(245, 158, 11, 0.6), inset 0 0 16px rgba(251, 191, 36, 0.55);
        border-color: #f59e0b;
      }
    }

    .scifi-tile-slot-selected {
      background: radial-gradient(circle at 50% 35%, rgba(251, 191, 36, 0.35) 0%, rgba(120, 53, 15, 0.65) 100%);
      border: 2px solid #fbbf24;
      border-radius: 10px;
      transform: scale(1.06);
      animation: slotSelectedPulse 1.4s infinite ease-in-out;
      position: relative;
      z-index: 20;
      cursor: pointer;
    }

    .scifi-tile-slot-filled {
      background: linear-gradient(180deg, #34d399 0%, #10b981 50%, #059669 100%);
      border: 1.5px solid #a7f3d0;
      border-radius: 10px;
      box-shadow: 0 4px 0 #064e3b, 0 6px 14px rgba(16, 185, 129, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      color: #ffffff;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      position: relative;
      cursor: pointer;
      transition: all 0.15s ease-out;
    }
    .scifi-tile-slot-filled:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .scifi-tile-slot-filled:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #064e3b, 0 3px 8px rgba(16, 185, 129, 0.4);
    }

    /* Target locked pending pulse on slot during flight */
    .scifi-tile-slot-target-locked {
      background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.35) 0%, rgba(9, 24, 62, 0.9) 100%);
      border: 2px solid #22d3ee;
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.8), inset 0 0 10px rgba(34, 211, 238, 0.5);
      position: relative;
      transform: scale(1.04);
      transition: all 0.15s ease-out;
    }

    /* Landing Impact Shockwave Wave */
    @keyframes slotImpactPulse {
      0% {
        transform: scale(0.85);
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.95), 0 0 25px rgba(0, 229, 255, 0.9);
        opacity: 1;
      }
      50% {
        transform: scale(1.3);
        box-shadow: 0 0 0 8px rgba(52, 211, 153, 0.35), 0 0 35px rgba(0, 229, 255, 0.65);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.6);
        box-shadow: 0 0 0 16px rgba(52, 211, 153, 0), 0 0 0 rgba(0, 229, 255, 0);
        opacity: 0;
      }
    }
    .slot-impact-wave {
      position: absolute;
      inset: -4px;
      border-radius: 14px;
      pointer-events: none;
      animation: slotImpactPulse 0.42s cubic-bezier(0.12, 0.9, 0.24, 1) forwards;
      border: 2px solid #67e8f9;
      z-index: 30;
    }

    /* Flying Tile Ghost Element */
    .scifi-flying-tile {
      position: absolute;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #34d399 0%, #10b981 50%, #059669 100%);
      border: 1.5px solid #a7f3d0;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      box-shadow: 0 4px 0 #064e3b, 0 0 22px rgba(52, 211, 153, 0.85), 0 0 40px rgba(0, 229, 255, 0.65);
      transform-origin: top left;
      will-change: transform, opacity;
    }

    .scifi-flying-tile-return {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 50%, #0369a1 100%);
      border-color: #7dd3fc;
      box-shadow: 0 4px 0 #075985, 0 0 22px rgba(56, 189, 248, 0.85), 0 0 40px rgba(0, 229, 255, 0.65);
    }

    .scifi-flying-trail-halo {
      position: absolute;
      inset: -6px;
      border-radius: 16px;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.45) 0%, rgba(0, 229, 255, 0.3) 50%, transparent 80%);
      pointer-events: none;
    }

    /* ===== NewroMath Lightweight Cyber-Arcade Gaming Loader =====
       Pure GPU-accelerated CSS (transform + opacity only, 0 SVG filters).
       Features 4 neon math operator cores (+ − × ÷) and a sleek cyan energy bar. */
    .nm-loader-overlay {
      position: absolute;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, #1d3c8c 0%, #112459 55%, #091436 100%);
      animation: nmLoaderFade 0.14s ease-out both;
      pointer-events: auto;
      user-select: none;
    }
    .nm-loader-overlay.nm-boot {
      animation: nmLoaderFade 0.16s ease-out 0.15s both;
    }
    .nm-cyber-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform: translateZ(0);
    }
    .nm-cyber-orbs {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nm-cyber-orb {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #ffffff;
      border: 1.5px solid rgba(125, 211, 252, 0.65);
      background: linear-gradient(145deg, rgba(56, 189, 248, 0.32), rgba(29, 78, 216, 0.55));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
      will-change: transform, opacity;
      animation: nmOrbPulse 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .nm-cyber-orb:nth-child(2) {
      animation-delay: 0.14s;
      border-color: rgba(167, 243, 208, 0.65);
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.32), rgba(5, 150, 105, 0.55));
    }
    .nm-cyber-orb:nth-child(3) {
      animation-delay: 0.28s;
      border-color: rgba(253, 230, 138, 0.7);
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.35), rgba(217, 119, 6, 0.58));
    }
    .nm-cyber-orb:nth-child(4) {
      animation-delay: 0.42s;
      border-color: rgba(216, 180, 254, 0.65);
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.32), rgba(109, 40, 217, 0.55));
    }
    .nm-cyber-bar-track {
      width: 148px;
      height: 5px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.35);
      overflow: hidden;
      position: relative;
    }
    .nm-cyber-bar-fill {
      width: 48%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #fde047, #34d399);
      will-change: transform;
      animation: nmBarSweep 0.95s ease-in-out infinite alternate;
    }
    .nm-cyber-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #bae6fd;
      opacity: 0.88;
    }
    @keyframes nmOrbPulse {
      0%, 100% { transform: translate3d(0, 0, 0) scale(0.94); opacity: 0.72; }
      50% { transform: translate3d(0, -6px, 0) scale(1.06); opacity: 1; }
    }
    @keyframes nmBarSweep {
      0% { transform: translate3d(-15%, 0, 0); }
      100% { transform: translate3d(125%, 0, 0); }
    }
    @keyframes nmLoaderFade { from { opacity: 0; } to { opacity: 1; } }
  </style>
